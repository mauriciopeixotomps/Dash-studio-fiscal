<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Fiscal — Período personalizado</title>
<style>
  :root {
    --bg: #1f1f1f; --card: #2a2622; --card-hi: #35302a; --border: #47403a;
    --text: #fdfdfd; --text-dim: #a49b8f; --accent: #d5ae77; --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
  .bar { padding: 20px 24px 0; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .subtitle { color: var(--text-dim); font-size: 14px; }
  .page-nav-link { background: var(--card-hi); border: 1px solid var(--border); color: var(--accent); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; text-decoration: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .picker { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .picker label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .picker input[type="date"], .picker select { background: var(--card-hi); border: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
  .picker input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .7; cursor: pointer; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .rtab { background: var(--card-hi); border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .rtab:hover { border-color: var(--accent); color: var(--text); }
  .go-btn { background: var(--accent); border: 1px solid var(--accent); color: #1f1f1f; font-size: 13px; font-weight: 700; padding: 9px 18px; border-radius: 8px; cursor: pointer; }
  .go-btn:disabled { opacity: .6; cursor: wait; }
  .status { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.5; }
  .status.err { color: var(--red); }
  #painel { width: 100%; border: 0; display: none; min-height: 600px; }
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <header>
    <div>
      <h1>Período personalizado</h1>
      <div class="subtitle">Studio Fiscal — a mesma página do painel, recortada pelo funil e pelo período escolhidos</div>
    </div>
    <a class="page-nav-link" href="index.html">← Ver mês atual</a>
  </header>
  <div class="card">
    <div class="picker">
      <div>
        <label for="funil">Funil</label>
        <select id="funil">
          <option value="inbound">Inbound</option>
          <option value="outbound">Outbound</option>
          <option value="rebarba">Rebarba</option>
        </select>
      </div>
      <div><label for="data-inicio">De</label><input type="date" id="data-inicio"></div>
      <div><label for="data-fim">Até</label><input type="date" id="data-fim"></div>
      <button class="go-btn" id="btn-ver">Ver período</button>
      <div class="presets">
        <button class="rtab" data-preset="mes-atual">Mês atual</button>
        <button class="rtab" data-preset="mes-anterior">Mês anterior</button>
        <button class="rtab" data-preset="ultimos-30">Últimos 30 dias</button>
        <button class="rtab" data-preset="ultimos-3">Últimos 3 meses</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>
</div></div>
<iframe id="painel" title="Painel do período"></iframe>
<script>
// Período personalizado (16/10/2026). Em vez de um resumo próprio, monta a
// MESMA página do painel (template da página publicada do funil) com um D
// recortado pelo período:
//  - mês fechado inteiro: usa o D publicado daquele mês, sem mexer (é a foto
//    do CRM naquele momento: previsão, ganhos, FPQs, perdidos, leads);
//  - qualquer outro recorte: junta os meses envolvidos e filtra tudo que tem
//    data (diários, perdidos, ranking, mapa de calor, FPQs, ganhos). A previsão
//    em aberto é a do último mês do período (a situação mais recente dele).
const MES_NOMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_LABEL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const FUNIS = {
  inbound:  { atual: 'index.html',    prefixo: '' },
  outbound: { atual: 'outbound.html', prefixo: 'outbound-' },
  rebarba:  { atual: 'rebarba.html',  prefixo: 'rebarba-' },
};

const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtBR = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 : null;
const clone = o => JSON.parse(JSON.stringify(o));

function mesesNoIntervalo(startIso, endIso) {
  const out = [];
  let [y, m] = startIso.split('-').map(Number);
  const [ey, em] = endIso.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) { out.push({ ano: y, mes: m }); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function diasUteis(startIso, endIso) {
  let n = 0;
  const d = new Date(startIso + 'T00:00:00'), e = new Date(endIso + 'T00:00:00');
  while (d <= e) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}
function diasDoIntervalo(startIso, endIso) {
  const out = [];
  const d = new Date(startIso + 'T00:00:00'), e = new Date(endIso + 'T00:00:00');
  while (d <= e) { out.push(isoDate(d)); d.setDate(d.getDate() + 1); }
  return out;
}

async function buscarPagina(url) {
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const html = await res.text();
    const m = html.match(/const D = (\{[\s\S]*?\});\s*\n/);
    if (!m) return null;
    return { url, html, D: JSON.parse(m[1]) };
  } catch (e) { return null; }
}

// ===== Recorte do D =====
const noPeriodo = (s, a, b) => { const d = (s || '').slice(0, 10); return d >= a && d <= b; };
function filtrarDiario(diario, a, b) {
  const out = {};
  Object.entries(diario || {}).forEach(([k, dias]) => {
    out[k] = {};
    Object.entries(dias || {}).forEach(([dia, v]) => { if (noPeriodo(dia, a, b)) out[k][dia] = (out[k][dia] || 0) + v; });
  });
  return out;
}
function somarDiarios(alvo, extra) {
  Object.entries(extra).forEach(([k, dias]) => {
    alvo[k] = alvo[k] || {};
    Object.entries(dias).forEach(([dia, v]) => { alvo[k][dia] = (alvo[k][dia] || 0) + v; });
  });
  return alvo;
}
const somaDias = dias => Object.values(dias || {}).reduce((s, v) => s + (v || 0), 0);

const CHAVES_CLOSER = ['leads', 'cc1_realizada', 'cc1_futura', 'fpq_realizada', 'cc2_realizada', 'cc2_futura', 'cc3_realizada', 'cc3_futura', 'contrato_enviado', 'contratos', 'contratos_franquia', 'contratos_partner', 'no_show'];
function totaisCloser(c) {
  CHAVES_CLOSER.forEach(k => { c[k] = somaDias(c.diario[k]); });
  c.conversao = {
    cc1_para_fpq: pct(c.fpq_realizada, c.cc1_realizada),
    fpq_para_cc2: pct(c.cc2_realizada, c.fpq_realizada),
    cc2_para_cc3: pct(c.cc3_realizada, c.cc2_realizada),
  };
  c.pct_no_show = pct(c.no_show, c.cc1_realizada + c.no_show);
  return c;
}

function rankingDe(leads, cc1, col) {
  const lc = {}, cc = {};
  leads.forEach(x => { const v = x[col]; if (v) lc[v] = (lc[v] || 0) + 1; });
  cc1.forEach(x => { const v = x[col]; if (v) cc[v] = (cc[v] || 0) + 1; });
  const itens = [...new Set([...Object.keys(lc), ...Object.keys(cc)])].map(nome => ({ nome, leads: lc[nome] || 0, cc1: cc[nome] || 0, conversao: pct(cc[nome] || 0, lc[nome] || 0) }));
  const melhores = itens.filter(i => i.cc1 > 0).sort((a, b) => (b.cc1 - a.cc1) || ((b.conversao || 0) - (a.conversao || 0))).slice(0, 5);
  let piores = itens.filter(i => i.leads >= 3);
  if (!piores.length) piores = itens.filter(i => i.leads >= 1);
  piores = piores.sort((a, b) => ((a.conversao ?? 999) - (b.conversao ?? 999)) || (a.cc1 - b.cc1)).slice(0, 5);
  return { melhores, piores };
}

function recortarD(paginas, a, b, hojeIso) {
  const ultimo = paginas[paginas.length - 1].D;
  const D = clone(ultimo);
  const ate = b < hojeIso ? b : hojeIso;
  D.periodo_inicio = a;
  D.periodo_fim = b;
  D.mes_label = `Período personalizado (${paginas.map(p => p.D.mes_label).join(' + ')})`;
  D.ritmo = { dias_uteis_total: diasUteis(a, b), dias_uteis_passados: a <= ate ? diasUteis(a, ate) : 0 };
  const avisos = [];

  // Fração de cada mês que cai no período (dias úteis) — usada só para metas.
  const fracaoMes = p => {
    const ini = p.D.periodo_inicio > a ? p.D.periodo_inicio : a;
    const fim = p.D.periodo_fim < b ? p.D.periodo_fim : b;
    const total = diasUteis(p.D.periodo_inicio, p.D.periodo_fim);
    return total && ini <= fim ? diasUteis(ini, fim) / total : 0;
  };
  const mesInteiro = p => p.D.periodo_inicio >= a && p.D.periodo_fim <= b;

  // Closers
  const closers = {};
  paginas.forEach(p => (p.D.closers || []).forEach(c => {
    if (!closers[c.nome]) closers[c.nome] = { nome: c.nome, foto: c.foto, diario: {} };
    somarDiarios(closers[c.nome].diario, filtrarDiario(c.diario, a, b));
  }));
  D.closers = Object.values(closers).map(totaisCloser);

  // Ritmo por indicador (pace)
  Object.keys(D.pace || {}).forEach(key => {
    const daily = {};
    let meta = 0, temMeta = false;
    paginas.forEach(p => {
      const pp = p.D.pace?.[key];
      if (!pp) return;
      Object.entries(pp.daily || {}).forEach(([dia, v]) => { if (noPeriodo(dia, a, b)) daily[dia] = (daily[dia] || 0) + v; });
      if (pp.meta !== null && pp.meta !== undefined) { meta += pp.meta * fracaoMes(p); temMeta = true; }
    });
    D.pace[key].daily = daily;
    D.pace[key].meta = temMeta ? Math.round(meta) : null;
    if (temMeta) {
      const dias = diasDoIntervalo(a, b), total = diasUteis(a, b);
      let uteis = 0;
      D.pace[key].ideal_cumulative = {};
      dias.forEach(dia => {
        const w = new Date(dia + 'T00:00:00').getDay();
        if (w !== 0 && w !== 6) uteis++;
        D.pace[key].ideal_cumulative[dia] = total ? Math.round(10 * meta * uteis / total) / 10 : 0;
      });
    } else {
      D.pace[key].ideal_cumulative = {};
    }
  });
  const somaMeta = campo => {
    let m = 0, tem = false;
    paginas.forEach(p => { if (p.D[campo] !== null && p.D[campo] !== undefined) { m += p.D[campo] * fracaoMes(p); tem = true; } });
    return tem ? Math.round(m) : null;
  };
  D.meta_contratos = somaMeta('meta_contratos');
  D.meta_leads = somaMeta('meta_leads');

  // Consolidado
  const cons = { conversao: {} };
  CHAVES_CLOSER.forEach(k => { cons[k] = D.closers.reduce((s, c) => s + (c[k] || 0), 0); });
  if (D.pace?.leads) cons.leads = somaDias(D.pace.leads.daily);
  cons.conversao = {
    cc1_para_fpq: pct(cons.fpq_realizada, cons.cc1_realizada),
    fpq_para_cc2: pct(cons.cc2_realizada, cons.fpq_realizada),
    cc2_para_cc3: pct(cons.cc3_realizada, cons.cc2_realizada),
  };
  cons.pct_no_show = pct(cons.no_show, cons.cc1_realizada + cons.no_show);
  if (ultimo.consolidado && ultimo.consolidado.leads_qualificados !== undefined) {
    // Leads qualificados e Agendado só existem como total do mês publicado.
    // Mês inteiro no período: soma o número publicado. Mês cortado: estima
    // pela proporção de leads daquele mês que caiu no período (sinalizado).
    let lq = 0, ag = 0, estimado = false;
    paginas.forEach(p => {
      const c = p.D.consolidado || {};
      if (c.leads_qualificados === undefined) return;
      if (mesInteiro(p)) { lq += c.leads_qualificados || 0; ag += c.cc1_agendado || 0; return; }
      const totalMes = somaDias(p.D.pace?.leads?.daily);
      const noRecorte = Object.entries(p.D.pace?.leads?.daily || {}).filter(([d]) => noPeriodo(d, a, b)).reduce((s, [, v]) => s + v, 0);
      const f = totalMes ? noRecorte / totalMes : 0;
      lq += Math.round((c.leads_qualificados || 0) * f);
      ag += Math.round((c.cc1_agendado || 0) * f);
      estimado = true;
    });
    cons.leads_qualificados = lq;
    cons.cc1_agendado = ag;
    if (estimado) avisos.push('"Leads qualificados" e "Agendado" do consolidado são estimados pela proporção de leads do mês que caiu no período (o painel só publica esses dois como total do mês).');
  }
  D.consolidado = Object.assign({}, ultimo.consolidado, cons);

  // Perdidos
  const perd = [];
  paginas.forEach(p => (p.D.perdidos?.detalhe || []).forEach(x => { if (noPeriodo(x.data, a, b)) perd.push(x); }));
  const motivos = {};
  perd.forEach(x => {
    const k = x.motivo || 'Não informado';
    motivos[k] = motivos[k] || { motivo: k, total: 0, qualificadora: 0, expansao: 0 };
    motivos[k].total++;
    if (x.pela_qualificadora) motivos[k].qualificadora++; else motivos[k].expansao++;
  });
  D.perdidos = Object.assign({}, ultimo.perdidos, {
    total: perd.length,
    pela_qualificadora: perd.filter(x => x.pela_qualificadora).length,
    apos_repasse: perd.filter(x => !x.pela_qualificadora).length,
    por_motivo: Object.values(motivos).sort((x, y) => y.total - x.total),
    detalhe: perd,
  });

  // Ranking de campanhas e criativos
  const rl = [], rc = [];
  paginas.forEach(p => {
    (p.D.ranking?.detalhe_leads || []).forEach(x => { if (noPeriodo(x.data, a, b)) rl.push(x); });
    (p.D.ranking?.detalhe_cc1 || []).forEach(x => { if (noPeriodo(x.data, a, b)) rc.push(x); });
  });
  D.ranking = { campanhas: rankingDe(rl, rc, 'utm_campanha'), criativos: rankingDe(rl, rc, 'utm_criativo'), detalhe_leads: rl, detalhe_cc1: rc };

  // Mapa de calor (seg-sex x 09h-20h)
  if (D.heatmap_cc1) {
    const det = [];
    paginas.forEach(p => (p.D.heatmap_cc1?.detalhe || []).forEach(x => { if (noPeriodo(x.data, a, b)) det.push(x); }));
    const horas = D.heatmap_cc1.horas || [];
    const matriz = (D.heatmap_cc1.dias || []).map(() => horas.map(() => 0));
    det.forEach(x => {
      const w = new Date(x.data.slice(0, 10) + 'T00:00:00').getDay();
      const hi = horas.indexOf(x.hora);
      if (w >= 1 && w <= 5 && hi >= 0) matriz[w - 1][hi]++;
    });
    D.heatmap_cc1 = Object.assign({}, D.heatmap_cc1, { matriz, detalhe: det });
  }

  // FPQs recebidas
  const fpqs = [];
  paginas.forEach(p => (p.D.fpqs_recebidas || []).forEach(x => { if (noPeriodo(x.data, a, b)) fpqs.push(x); }));
  D.fpqs_recebidas = fpqs.sort((x, y) => (y.data || '').localeCompare(x.data || ''));

  // Previsão: em aberto = a do último mês do período; ganhos = os do período,
  // de todos os meses envolvidos (sem repetir negócio).
  const ganhos = {};
  paginas.forEach(p => (p.D.previsao || []).forEach(r => {
    if (r.deal_status === 'won' && noPeriodo(r.won_time, a, b)) ganhos[r.deal_id || (r.closer + r.lead)] = r;
  }));
  const abertos = (ultimo.previsao || []).filter(r => r.deal_status !== 'won');
  D.previsao = [...Object.values(ganhos).sort((x, y) => (x.won_time || '').localeCompare(y.won_time || '')), ...abertos];
  // Placar e "Negócios fechados": usa a lista de Ganhos do Pipedrive (D.ganhos,
  // publicada a partir de 16/10/2026); mês publicado antes disso cai na
  // previsão (só os ganhos que estavam na planilha).
  const g = [];
  paginas.forEach(p => {
    if (Array.isArray(p.D.ganhos)) {
      p.D.ganhos.forEach(x => { if (noPeriodo(x.won_time, a, b)) g.push(x); });
    } else {
      (p.D.previsao || []).forEach(r => {
        if (r.deal_status === 'won' && noPeriodo(r.won_time, a, b)) g.push({
          deal_id: r.deal_id, titulo: r.lead, pessoa_nome: r.lead, closer_nome: r.closer,
          won_time: r.won_time, tipo_contrato: r.tipo_contrato, valor: Number(r.venda_realizada) || 0,
          caixa: Number(r.caixa_realizado) || 0, funil: r.funil, deal_link: r.deal_link,
        });
      });
    }
  });
  g.sort((x, y) => (x.won_time || '').localeCompare(y.won_time || ''));
  D.ganhos = g;
  const soma = (arr, campo) => arr.reduce((s, r) => s + (Number(r[campo]) || 0), 0);
  const gF = g.filter(r => r.tipo_contrato === 'franquia'), gP = g.filter(r => r.tipo_contrato === 'partner');
  D.scoreboard = Object.assign({}, ultimo.scoreboard, {
    contratos_fechados: g.length,
    contratos_fechados_franquia: gF.length,
    contratos_fechados_partner: gP.length,
    venda_realizada_total: soma(g, 'valor'),
    venda_realizada_franquia: soma(gF, 'valor'),
    venda_realizada_partner: soma(gP, 'valor'),
    caixa_realizado_total: soma(g, 'caixa'),
    caixa_realizado_franquia: soma(gF, 'caixa'),
    caixa_realizado_partner: soma(gP, 'caixa'),
  });

  // Time de agendamento
  if (D.agendadores) {
    const meta = ultimo.agendadores_meta || { meta_agendamento_pct: 30, meta_realizada_pct: 65 };
    const ags = {};
    paginas.forEach(p => (p.D.agendadores || []).forEach(x => {
      if (!ags[x.nome]) ags[x.nome] = { nome: x.nome, diario: {} };
      somarDiarios(ags[x.nome].diario, filtrarDiario(x.diario, a, b));
    }));
    D.agendadores = Object.values(ags).map(x => {
      const leads = somaDias(x.diario.leads_recebidos), ag = somaDias(x.diario.agendamentos);
      const re = somaDias(x.diario.realizadas), ns = somaDias(x.diario.no_show);
      const alvoAg = Math.ceil(leads * meta.meta_agendamento_pct / 100);
      return Object.assign(x, {
        leads_recebidos: leads, agendamentos: ag, realizadas: re, no_show: ns,
        pct_agendamento: pct(ag, leads), pct_realizada: pct(re, ag), pct_no_show: pct(ns, ag),
        faltam_agendamentos: Math.max(0, alvoAg - ag),
        faltam_realizadas: Math.max(0, Math.ceil(alvoAg * meta.meta_realizada_pct / 100) - re),
      });
    }).filter(x => x.leads_recebidos || x.agendamentos || x.realizadas);
  }
  return { D, avisos };
}

// ===== Montagem =====
function montarIframe(pagina, D) {
  const json = JSON.stringify(D).replace(/<\//g, '<\\/');
  let html = pagina.html.replace(/const D = \{[\s\S]*?\};\s*\n/, () => `const D = ${json};\n`);
  // Links internos (histórico, outros funis) abrem na janela inteira.
  html = html.replace('<head>', '<head><base href="' + new URL('.', location.href).href + '" target="_top">');
  const frame = document.getElementById('painel');
  frame.onload = () => {
    const ajustar = () => { try { frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) {} };
    ajustar();
    try { new ResizeObserver(ajustar).observe(frame.contentDocument.body); } catch (e) {}
    [300, 1000, 2500, 5000].forEach(ms => setTimeout(ajustar, ms));
  };
  frame.style.display = 'block';
  frame.srcdoc = html;
}

async function verPeriodo(a, b, funil) {
  const st = document.getElementById('status'), btn = document.getElementById('btn-ver');
  if (!a || !b || a > b) { st.className = 'status err'; st.textContent = 'Escolha um período válido.'; return; }
  btn.disabled = true; st.className = 'status'; st.textContent = 'Buscando os meses publicados...';
  const cfg = FUNIS[funil];
  const urls = new Set([cfg.atual]);
  mesesNoIntervalo(a, b).forEach(({ ano, mes }) => urls.add(`${cfg.prefixo}${MES_NOMES[mes - 1]}-${ano}.html`));
  const paginas = [], vistos = new Set();
  for (const url of urls) {
    const p = await buscarPagina(url);
    if (!p || !p.D.periodo_inicio || !p.D.periodo_fim) continue;
    if (p.D.periodo_fim < a || p.D.periodo_inicio > b) continue;
    const chave = p.D.periodo_inicio;
    if (vistos.has(chave)) continue;
    vistos.add(chave);
    paginas.push(p);
  }
  paginas.sort((x, y) => x.D.periodo_inicio.localeCompare(y.D.periodo_inicio));
  if (!paginas.length) {
    st.className = 'status err'; st.textContent = 'Não encontrei página publicada desse funil para esse período.';
    btn.disabled = false; return;
  }
  const hoje = isoDate(new Date());
  const unico = paginas.length === 1 && paginas[0].D.periodo_inicio === a &&
    (paginas[0].D.periodo_fim === b || (b >= hoje && paginas[0].D.periodo_fim >= hoje));
  let D, avisos = [];
  if (unico) {
    D = paginas[0].D;
  } else {
    ({ D, avisos } = recortarD(paginas, a, b, hoje));
  }
  const faltando = mesesNoIntervalo(a, b).filter(({ ano, mes }) => !paginas.some(p => p.D.periodo_inicio.startsWith(`${ano}-${String(mes).padStart(2, '0')}`)));
  if (faltando.length) avisos.push('Sem página publicada para: ' + faltando.map(({ ano, mes }) => `${MES_LABEL[mes - 1]} ${ano}`).join(', ') + '.');
  if (!unico) avisos.push('Previsão em aberto: situação de ' + paginas[paginas.length - 1].D.mes_label + '. Ganhos: todos os fechados no período.');
  montarIframe(paginas[paginas.length - 1], D);
  st.innerHTML = `${funil.charAt(0).toUpperCase() + funil.slice(1)} · ${fmtBR(a)} a ${fmtBR(b)} · ` +
    (unico ? `mês publicado de ${D.mes_label}, sem recorte.` : `meses usados: ${paginas.map(p => p.D.mes_label).join(', ')}.`) +
    (avisos.length ? '<br>' + avisos.join('<br>') : '');
  btn.disabled = false;
  try { history.replaceState(null, '', `?funil=${funil}&de=${a}&ate=${b}`); } catch (e) {}
}

function preset(nome) {
  const h = new Date(); let a, b;
  if (nome === 'mes-atual') { a = new Date(h.getFullYear(), h.getMonth(), 1); b = new Date(h.getFullYear(), h.getMonth() + 1, 0); }
  if (nome === 'mes-anterior') { a = new Date(h.getFullYear(), h.getMonth() - 1, 1); b = new Date(h.getFullYear(), h.getMonth(), 0); }
  if (nome === 'ultimos-30') { a = new Date(h); a.setDate(a.getDate() - 29); b = h; }
  if (nome === 'ultimos-3') { a = new Date(h.getFullYear(), h.getMonth() - 2, 1); b = h; }
  document.getElementById('data-inicio').value = isoDate(a);
  document.getElementById('data-fim').value = isoDate(b);
  ver();
}
function ver() {
  verPeriodo(document.getElementById('data-inicio').value, document.getElementById('data-fim').value, document.getElementById('funil').value);
}
document.getElementById('btn-ver').addEventListener('click', ver);
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => preset(b.dataset.preset)));
document.getElementById('funil').addEventListener('change', () => { if (document.getElementById('data-inicio').value) ver(); });

const qs = new URLSearchParams(location.search);
if (qs.get('funil') && FUNIS[qs.get('funil')]) document.getElementById('funil').value = qs.get('funil');
if (qs.get('de') && qs.get('ate')) {
  document.getElementById('data-inicio').value = qs.get('de');
  document.getElementById('data-fim').value = qs.get('ate');
  ver();
} else {
  preset('mes-anterior');
}
</script>
