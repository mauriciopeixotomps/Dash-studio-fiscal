# Publica o painel no GitHub Pages a cada push no main (inclusive os do robô).
# Na cópia publicada, sem alterar os arquivos do repositório:
#  - acrescenta o botão "Resumo executivo" ao lado de "Período personalizado"
#    em todas as páginas do painel que têm esse botão;
#  - gera reunioes/index.json com a lista das notas de reunião publicadas.
# Requer: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publicar painel

on:
  push:
    branches: [main]
  schedule:
    - cron: "15,45 * * * *"   # reserva, caso algum push não dispare a publicação
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Montar site
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
          node scripts/publicar-site.js _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
